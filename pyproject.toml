[project]
name = "accessflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanish Mishra", email = "tanishmishra2025@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
accessflow = "accessflow:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
