services:
  api:
    build: .
    container_name: accessflow-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: accessflow-db
    environment:
      POSTGRES_USER: accessflow
      POSTGRES_PASSWORD: accessflow
      POSTGRES_DB: accessflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: