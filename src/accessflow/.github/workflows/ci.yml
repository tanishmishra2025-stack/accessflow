name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Tests use an in-memory SQLite database and a mocked scanner,
    # so no live PostgreSQL database or browser is required in CI.
    # DATABASE_URL is still provided because the application reads it
    # during import, even though the test suite overrides the DB session.
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -v